# Configurazione Supabase CLI (vedi README in supabase/migrations per la
# procedura di allineamento dello storico migrazioni).
project_id = "rixivmeipbizoxyvrvaf"

[functions.nightly-elo-recalc]
# L'Edge Function accetta solo JWT service_role: la verifica firma della
# piattaforma è obbligatoria perché il check interno decodifica il payload
# senza validarne la firma.
verify_jwt = true
# Il refresh globale è pianificato ogni minuto tramite pg_cron e pg_net:
# scripts/atomic-play-migrations/04-schedule-elo.sql.
# La credenziale rimane in Vault; il comando cron non contiene segreti.
